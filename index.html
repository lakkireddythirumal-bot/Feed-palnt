<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Feed Plant Manager</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  padding-bottom:82px;
}

button{font-family:inherit}

.app{
  width:100%;
  max-width:720px;
  margin:auto;
}

/* HEADER */

.header{
  background:#fff;
  padding:20px 18px 14px;
  border-bottom:1px solid #e8ebf0;
  position:sticky;
  top:0;
  z-index:20;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  font-size:21px;
  font-weight:800;
}

.subtitle{
  font-size:12px;
  color:#7b8494;
  margin-top:3px;
}

.bell{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#f1f5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

/* CONTENT */

.content{
  padding:16px;
}

.section-title{
  font-size:17px;
  font-weight:800;
  margin:22px 2px 11px;
}

.report-info{
  font-size:12px;
  color:#7c8594;
  margin-top:10px;
}

/* ALERT */

.alert-card{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 3px 15px rgba(25,35,55,.06);
}

.alert-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.alert-title{
  font-weight:800;
}

.alert-normal{
  color:#159447;
  background:#eaf8ef;
  padding:5px 9px;
  border-radius:10px;
  font-size:11px;
  font-weight:700;
}

.alert-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-top:1px solid #f0f1f4;
  font-size:13px;
}

.alert-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ef4444;
}

.alert-text{flex:1}

.alert-value{
  color:#e53935;
  font-weight:700;
}

/* KPI */

.kpi-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.kpi{
  background:#fff;
  border-radius:18px;
  padding:17px 15px;
  box-shadow:0 3px 15px rgba(25,35,55,.06);
}

.kpi-icon{font-size:23px}

.kpi-label{
  color:#747e8f;
  font-size:12px;
  margin-top:10px;
}

.kpi-value{
  font-size:22px;
  font-weight:800;
  margin-top:3px;
}

.kpi-unit{
  font-size:11px;
  color:#7d8695;
  font-weight:500;
}

/* BIG KPI */

.big-kpi{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 3px 15px rgba(25,35,55,.06);
}

.big-kpi-icon{font-size:25px}

.big-kpi-title{
  color:#737d8d;
  font-size:13px;
  margin-top:7px;
}

.big-kpi-value{
  font-size:31px;
  font-weight:850;
  margin-top:2px;
}

/* PERIOD */

.period{
  display:flex;
  background:#e9edf3;
  padding:4px;
  border-radius:13px;
  margin-bottom:13px;
}

.period button{
  flex:1;
  border:0;
  background:transparent;
  padding:10px 4px;
  border-radius:10px;
  color:#667085;
  font-weight:700;
  font-size:12px;
}

.period button.active{
  background:#fff;
  color:#2563eb;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

/* SEARCH */

.search{
  background:#fff;
  border-radius:14px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
  border:1px solid #edf0f4;
}

.search input{
  border:0;
  outline:none;
  width:100%;
  font-size:14px;
  background:transparent;
}

/* MATERIAL */

.material-card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:10px;
  box-shadow:0 3px 13px rgba(25,35,55,.05);
  cursor:pointer;
}

.material-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.material-name{
  font-size:15px;
  font-weight:800;
}

.material-stock{
  font-size:21px;
  font-weight:800;
  margin-top:3px;
}

.material-unit{
  font-size:11px;
  color:#7c8492;
}

.material-status{
  font-size:10px;
  font-weight:800;
  padding:6px 8px;
  border-radius:9px;
}

.status-ok{
  color:#138a42;
  background:#e9f8ef;
}

.status-reorder{
  color:#d92d20;
  background:#fff0ef;
}

.material-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:13px;
}

.stat-box{
  background:#f7f8fa;
  border-radius:11px;
  padding:9px;
}

.stat-label{
  font-size:10px;
  color:#7d8695;
}

.stat-value{
  font-size:13px;
  font-weight:750;
  margin-top:3px;
}

/* PRODUCT */

.product-card{
  background:#fff;
  border-radius:17px;
  padding:15px;
  margin-bottom:9px;
  box-shadow:0 3px 13px rgba(25,35,55,.05);
}

.product-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.product-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#f0f5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.product-info{flex:1}

.product-name{
  font-size:14px;
  font-weight:800;
}

.product-weight{
  font-size:10px;
  color:#808998;
  margin-top:2px;
}

.product-bags{
  text-align:right;
  font-size:16px;
  font-weight:800;
}

.product-bags small{
  display:block;
  font-size:9px;
  color:#7e8795;
  font-weight:500;
}

/* PP BAG */

.bag-card{
  background:#fff;
  border-radius:18px;
  padding:17px;
  margin-bottom:10px;
  box-shadow:0 3px 13px rgba(25,35,55,.05);
}

.bag-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:12px;
}

.bag-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.bag-stat{
  background:#f7f8fa;
  padding:11px;
  border-radius:11px;
}

.bag-stat span{
  display:block;
  color:#7c8594;
  font-size:10px;
}

.bag-stat strong{
  display:block;
  font-size:15px;
  margin-top:3px;
}

/* CHART */

.chart-card{
  background:#fff;
  border-radius:19px;
  padding:17px;
  box-shadow:0 3px 15px rgba(25,35,55,.06);
}

.chart-title{
  font-size:15px;
  font-weight:800;
}

.chart-subtitle{
  font-size:11px;
  color:#7d8695;
  margin-top:3px;
}

.chart{
  width:100%;
  height:190px;
  margin-top:14px;
}

/* TABS */

.detail-tabs{
  display:flex;
  background:#edf0f4;
  border-radius:12px;
  padding:4px;
  margin:15px 0;
}

.detail-tabs button{
  flex:1;
  border:0;
  background:transparent;
  padding:10px 4px;
  border-radius:9px;
  font-size:11px;
  font-weight:750;
  color:#697384;
}

.detail-tabs button.active{
  background:#fff;
  color:#2563eb;
}

/* TRANSACTION */

.transaction{
  background:#fff;
  border-radius:14px;
  padding:13px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 9px rgba(25,35,55,.04);
}

.transaction-left{
  display:flex;
  gap:10px;
  align-items:center;
}

.transaction-icon{
  width:35px;
  height:35px;
  border-radius:11px;
  background:#f2f5f8;
  display:flex;
  justify-content:center;
  align-items:center;
}

.transaction-name{
  font-size:12px;
  font-weight:750;
}

.transaction-date{
  font-size:10px;
  color:#818a98;
  margin-top:2px;
}

.transaction-value{
  font-size:13px;
  font-weight:800;
}

.received{color:#148a45}
.consumption{color:#d64545}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.42);
  z-index:100;
  display:none;
  align-items:flex-end;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:720px;
  margin:auto;
  background:#f5f7fb;
  border-radius:25px 25px 0 0;
  max-height:92vh;
  overflow:auto;
  padding:18px 16px 30px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.modal-title{
  font-size:20px;
  font-weight:850;
}

.close{
  width:38px;
  height:38px;
  border:0;
  background:#e9edf2;
  border-radius:12px;
  font-size:20px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.97);
  border-top:1px solid #e7eaf0;
  display:flex;
  justify-content:center;
  z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-inner{
  width:100%;
  max-width:720px;
  display:flex;
}

.nav-btn{
  flex:1;
  border:0;
  background:transparent;
  padding:10px 3px 9px;
  color:#7b8494;
  font-size:10px;
  font-weight:650;
}

.nav-btn span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.nav-btn.active{color:#2563eb}

/* LOADING */

.loading{
  text-align:center;
  padding:45px 10px;
  color:#778191;
  font-size:13px;
}

.error{
  background:#fff0ef;
  color:#c62828;
  border-radius:15px;
  padding:15px;
  font-size:13px;
}

.empty{
  text-align:center;
  padding:25px;
  color:#858e9d;
  font-size:13px;
}

@media(min-width:700px){

  .content{padding:22px}

  .kpi-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .bottom-nav{
    border-radius:18px 18px 0 0;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="header-top">

    <div>
      <div class="title">🌿 Feed Plant Manager</div>
      <div class="subtitle">Manager Dashboard</div>
    </div>

    <div class="bell">🔔</div>

  </div>

  <div class="report-info" id="reportInfo">
    Loading MIS data...
  </div>

</header>


<main class="content" id="app">

  <div class="loading">
    Loading dashboard...
  </div>

</main>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-head">

      <div class="modal-title" id="modalTitle"></div>

      <button class="close" onclick="closeModal()">×</button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="nav-inner">

    <button class="nav-btn active"
            onclick="showPage('home',this)">
      <span>🏠</span>
      Home
    </button>

    <button class="nav-btn"
            onclick="showPage('stock',this)">
      <span>📦</span>
      Stock
    </button>

    <button class="nav-btn"
            onclick="showPage('production',this)">
      <span>🏭</span>
      Production
    </button>

    <button class="nav-btn"
            onclick="showPage('bags',this)">
      <span>🛍️</span>
      PP Bags
    </button>

    <button class="nav-btn"
            onclick="showPage('reports',this)">
      <span>📊</span>
      Reports
    </button>

  </div>

</nav>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw4Z4aNx2RJQOWfLmIxiD6dFeVZ3beeIL6VdWLXg2DoR8OMROSYXYPXyd7-QPdlTTYK/exec";


/* =========================================================
   GLOBAL DATA
========================================================= */

let DATA = {
  stock: [],
  production: [],
  pp_bags: [],
  reorder_items: [],
  productionTrend: [],
  productionTrendBags: [],
  usage: [],
  consumption: 0,
  efficiency: null,
  processLoss: null,
  report_date: null
};

let currentPeriod = "day";


/* =========================================================
   PRODUCTION BAG WEIGHTS
========================================================= */

const BAG_WEIGHTS = {

  "LC CRUMBLE":70,
  "CHICK CR":70,
  "GCON CR":50,
  "PSC":70,
  "BFP":70,
  "LM /LM TP":75,
  "FM/PLM/YL":75,
  "BSC":70,
  "FC30.CR":60,
  "GCR":70

};


/* =========================================================
   HELPERS
========================================================= */

function normalize(value){

  return String(value ?? "")
    .trim()
    .replace(/\s+/g," ")
    .toUpperCase();

}


function number(value){

  if(value === null ||
     value === undefined ||
     value === "")
    return null;

  const n = Number(value);

  return Number.isFinite(n) ? n : null;

}


function formatNumber(value,decimals=2){

  const n = number(value);

  if(n === null)
    return "—";

  return n.toLocaleString("en-IN",{
    minimumFractionDigits:decimals,
    maximumFractionDigits:decimals
  });

}


function formatBags(value){

  const n = number(value);

  if(n === null)
    return "—";

  return Math.round(n).toLocaleString("en-IN");

}


function dateText(value){

  if(!value)
    return "—";

  const d = new Date(value);

  if(isNaN(d.getTime()))
    return String(value);

  return d.toLocaleDateString("en-IN",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });

}


function getBagWeight(product){

  return BAG_WEIGHTS[normalize(product)] ?? null;

}


function mtToBags(mt,product){

  const weight = getBagWeight(product);
  const value = number(mt);

  if(value === null || !weight)
    return null;

  return value * 1000 / weight;

}


function safePeriodValue(row){

  if(currentPeriod === "month")
    return number(row.for_month);

  if(currentPeriod === "year")
    return number(row.for_year);

  return number(row.for_day);

}


/* =========================================================
   JSONP
========================================================= */

function loadDashboard(){

  const callbackName =
    "dashboardCallback_" + Date.now();


  window[callbackName] = function(result){

    try{

      if(!result ||
         result.status !== "success"){

        throw new Error(
          "API returned invalid data"
        );

      }

      DATA = result;

      document.getElementById(
        "reportInfo"
      ).innerHTML =
        "📅 Report: <b>" +
        dateText(DATA.report_date) +
        "</b> &nbsp; • &nbsp; ✓ MIS data loaded";


      renderDashboard();

    }
    catch(error){

      showError(error.message);

    }
    finally{

      delete window[callbackName];

      const script =
        document.getElementById(callbackName);

      if(script)
        script.remove();

    }

  };


  const script =
    document.createElement("script");

  script.id = callbackName;

  script.src =
    API_URL +
    "?callback=" +
    callbackName +
    "&_=" +
    Date.now();


  script.onerror = function(){

    showError(
      "Unable to connect to MIS API."
    );

  };


  document.body.appendChild(script);

}


function showError(message){

  document.getElementById("app").innerHTML = `

    <div class="error">

      ⚠️ <b>Dashboard data unavailable</b>

      <br><br>

      ${message}

    </div>

  `;

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page,button){

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  if(button)
    button.classList.add("active");


  if(page === "home")
    renderHome();

  if(page === "stock")
    renderStock();

  if(page === "production")
    renderProduction();

  if(page === "bags")
    renderBags();

  if(page === "reports")
    renderReports();

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  renderHome();

}


function renderHome(){

  const app =
    document.getElementById("app");


  const totalStock =
    DATA.stock.reduce(
      (sum,item)=>
        sum + (number(item.closing) || 0),
      0
    );


  const productionBags =
    DATA.production.reduce(
      (sum,row)=>{

        const bags =
          mtToBags(
            row.actual_output,
            row.product
          );

        return sum + (bags || 0);

      },
      0
    );


  const totalConsumption =
    DATA.consumption || 0;


  const totalPPBags =
    DATA.pp_bags.reduce(
      (sum,row)=>
        sum + (number(row.closing) || 0),
      0
    );


  app.innerHTML = `

    <div class="section-title">
      🚨 Attention
    </div>

    ${renderHomeAlerts()}


    <div class="section-title">
      📌 Today's Overview
    </div>


    <div class="kpi-grid">

      <div class="kpi">

        <div class="kpi-icon">📦</div>

        <div class="kpi-label">
          Total Material Stock
        </div>

        <div class="kpi-value">
          ${formatNumber(totalStock)}
        </div>

        <div class="kpi-unit">
          MT
        </div>

      </div>


      <div class="kpi">

        <div class="kpi-icon">🏭</div>

        <div class="kpi-label">
          Today's Production
        </div>

        <div class="kpi-value">
          ${formatBags(productionBags)}
        </div>

        <div class="kpi-unit">
          Bags
        </div>

      </div>


      <div class="kpi">

        <div class="kpi-icon">📉</div>

        <div class="kpi-label">
          Today's Consumption
        </div>

        <div class="kpi-value">
          ${formatNumber(totalConsumption)}
        </div>

        <div class="kpi-unit">
          MT
        </div>

      </div>


      <div class="kpi">

        <div class="kpi-icon">🛍️</div>

        <div class="kpi-label">
          Total PP Bag Stock
        </div>

        <div class="kpi-value">
          ${formatBags(totalPPBags)}
        </div>

        <div class="kpi-unit">
          Bags
        </div>

      </div>

    </div>


    <div class="section-title">
      🏭 Production Trend
    </div>

    ${renderProductionTrend()}


    <div class="section-title">
      📦 Stock Alerts
    </div>

    ${renderStockAlerts()}

  `;

}


/* =========================================================
   ALERTS
========================================================= */

function renderHomeAlerts(){

  const items =
    Array.isArray(DATA.reorder_items)
      ? DATA.reorder_items
      : [];


  if(items.length === 0){

    return `

      <div class="alert-card">

        <div class="alert-header">

          <div class="alert-title">
            🟢 All Operations Normal
          </div>

          <div class="alert-normal">
            NORMAL
          </div>

        </div>

        <div style="
          font-size:12px;
          color:#7b8494;
        ">

          No material is currently below
          its configured reorder level.

        </div>

      </div>

    `;

  }


  return `

    <div class="alert-card">

      <div class="alert-header">

        <div class="alert-title">
          🚨 ${items.length} Reorder Alert
          ${items.length > 1 ? "s" : ""}
        </div>

      </div>


      ${items.slice(0,5).map(item=>`

        <div class="alert-item">

          <div class="alert-dot"></div>

          <div class="alert-text">

            <b>
              ${escapeHTML(item.material)}
            </b>

            <br>

            <span style="color:#7b8494;">
              Stock
              ${formatNumber(item.closing)}
              ${escapeHTML(item.unit || "MT")}
            </span>

          </div>

          <div class="alert-value">
            REORDER
          </div>

        </div>

      `).join("")}

    </div>

  `;

}


function renderStockAlerts(){

  const items =
    Array.isArray(DATA.reorder_items)
      ? DATA.reorder_items
      : [];


  if(items.length === 0){

    return `

      <div class="alert-card">

        <div style="
          text-align:center;
          padding:8px;
          color:#159447;
        ">
          ✓ No reorder alerts
        </div>

      </div>

    `;

  }


  return items.slice(0,8).map(item=>`

    <div
      class="material-card"
      onclick="openMaterialDetails(
        '${escapeAttr(item.material)}'
      )"
    >

      <div class="material-top">

        <div>

          <div class="material-name">
            ${escapeHTML(item.material)}
          </div>

          <div class="material-stock">

            ${formatNumber(item.closing)}

            <span class="material-unit">
              ${escapeHTML(item.unit || "MT")}
            </span>

          </div>

        </div>


        <div class="
          material-status
          status-reorder
        ">
          🔴 REORDER
        </div>

      </div>

    </div>

  `).join("");

}


/* =========================================================
   PRODUCTION TREND
========================================================= */

function renderProductionTrend(){

  const trend =
    Array.isArray(DATA.productionTrend)
      ? DATA.productionTrend
      : [];


  if(trend.length === 0){

    return `

      <div class="chart-card">

        <div class="empty">
          No production trend data available
        </div>

      </div>

    `;

  }


  const max =
    Math.max(
      ...trend.map(x=>number(x)||0),
      1
    );


  return `

    <div class="chart-card">

      <div class="chart-title">
        📊 Production
      </div>

      <div class="chart-subtitle">
        Historical API trend
      </div>


      <div class="chart">

        <svg
          width="100%"
          height="190"
          viewBox="0 0 360 190"
          preserveAspectRatio="none"
        >

          <line
            x1="10"
            y1="170"
            x2="350"
            y2="170"
            stroke="#e6e9ee"
          />


          ${trend.map((value,index)=>{

            const x =
              trend.length === 1
              ? 180
              : 20 +
                index *
                (320/(trend.length-1));


            const y =
              165 -
              ((number(value)||0)/max)*135;


            return `

              <circle
                cx="${x}"
                cy="${y}"
                r="4"
                fill="#2563eb"
              />

            `;

          }).join("")}


          <polyline
            fill="none"
            stroke="#2563eb"
            stroke-width="3"
            points="${
              trend.map((value,index)=>{

                const x =
                  trend.length === 1
                  ? 180
                  : 20 +
                    index *
                    (320/(trend.length-1));


                const y =
                  165 -
                  ((number(value)||0)/max)*135;


                return `${x},${y}`;

              }).join(" ")
            }"
          />

        </svg>

      </div>


      <div style="
        font-size:10px;
        color:#7d8695;
        text-align:center;
      ">
        Current API trend • MT
      </div>

    </div>

  `;

}

  if(!summary || !list)
    return;


  let received = 0;
  let consumption = 0;


  DATA.stock.forEach(row=>{

    const value =
      safePeriodValue(row);


    if(value === null)

    const transaction =
      normalize(row.transaction);


    if(
      transaction === "PURCHASE" ||
      transaction.includes("TRANSFER FROM") ||
      transaction === "TRANSFER"

      received += Math.abs(value);

    }


    if(transaction === "CONSUMPTION"){

          normalize(item.material);

        (number(b.closing)||0) -

/* =========================================================
   MATERIAL HELPERS
========================================================= */

function getMaterialTransactions(material){

  return DATA.stock.filter(row =>
    normalize(row.material) ===
    normalize(material)
  );

}


function getMaterialPeriodTotal(
  material,
  transaction
){

  return getMaterialTransactions(material)
    .filter(row =>
      normalize(row.transaction) ===
      normalize(transaction)
    )
    .reduce((sum,row)=>{

      const value =
        safePeriodValue(row);

      return sum +
        (value === null
          ? 0
          : Math.abs(value));

    },0);

}


function getMaterialReceivedTotal(material){

  const receivedTypes = [

    "PURCHASE",
    "TRANSFER",
    "TRANSFER FROM SOYA DIVISION",
    "TRANSFER FROM BMKL"

  ];


  return getMaterialTransactions(material)
    .filter(row =>
      receivedTypes.includes(
        normalize(row.transaction)
      )
    )
    .reduce((sum,row)=>{

      const value =
        safePeriodValue(row);

      return sum +
        (value === null
          ? 0
          : Math.abs(value));

    },0);

}

    filtered =

              )}

      }).join("");

                </strong>

              </div>

            </div>

          </div>

        `).join("")
      : `
        <div class="empty">
          No PP Bag data available.
        </div>
      `
    }

  `;

}

/* =========================================================
   MODAL
========================================================= */

function openModal(){

  document
    .getElementById("modal")
    .classList.add("show");

}


function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this)
        closeModal();

    }
  );


/* =========================================================
   UTILITY
========================================================= */

function periodName(period){

  if(period === "month")
    return "MONTH";

  if(period === "year")
    return "YEAR";

  return "DAY";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}
