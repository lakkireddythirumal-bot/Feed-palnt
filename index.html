<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feed Plant Inventory</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f6f9;
color:#172033
}

header{
background:#182338;
color:white;
padding:18px;
font-size:20px;
font-weight:bold
}

main{
padding:16px;
max-width:900px;
margin:auto
}

nav{
display:flex;
gap:7px;
overflow:auto;
margin-bottom:15px
}

button{
border:0;
border-radius:8px;
padding:11px 14px;
background:#263b5b;
color:white;
font-weight:bold
}

button.active{
background:#16834b
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.card,.panel{
background:white;
padding:15px;
border-radius:12px;
margin-top:10px
}

.num{
font-size:25px;
font-weight:bold;
margin-top:5px
}

input,select{
width:100%;
padding:11px;
margin:6px 0 12px;
border:1px solid #d6dce6;
border-radius:8px;
box-sizing:border-box
}

table{
width:100%;
border-collapse:collapse
}

th,td{
padding:9px 5px;
border-bottom:1px solid #eee;
text-align:left;
font-size:12px
}

.hidden{
display:none
}

.ok{
color:#16834b
}

.low{
color:#a86100
}

.out{
color:#c33
}

.msg{
padding:10px;
background:#eef5ff;
border-radius:8px;
margin-top:10px
}
</style>
</head>

<body>

<header>
🔧 Feed Plant Spare Parts
</header>

<main>

<nav>
<button class="active" data-p="dash">Dashboard</button>
<button data-p="parts">Spare Parts</button>
<button data-p="in">Stock In</button>
<button data-p="out">Stock Issue</button>
<button data-p="hist">History</button>
</nav>


<section id="dash">

<div class="cards">

<div class="card">
TOTAL PARTS
<div class="num" id="total"></div>
</div>

<div class="card">
TOTAL STOCK
<div class="num ok" id="stock"></div>
</div>

<div class="card">
LOW STOCK
<div class="num low" id="low"></div>
</div>

<div class="card">
OUT OF STOCK
<div class="num out" id="outn"></div>
</div>

</div>


<div class="panel">

<input id="dsearch" placeholder="🔍 Search part">

<table>

<thead>
<tr>
<th>Part</th>
<th>Stock</th>
<th>Status</th>
</tr>
</thead>

<tbody id="dt"></tbody>

</table>

</div>

</section>


<section id="parts" class="hidden">

<div class="panel">

<input id="search" placeholder="🔍 Search part or category">

<table>

<thead>
<tr>
<th>Part</th>
<th>Category</th>
<th>Stock</th>
<th>Status</th>
</tr>
</thead>

<tbody id="pt"></tbody>

</table>

</div>

</section>


<section id="in" class="hidden">

<div class="panel">

<h2>➕ Stock In</h2>

<select id="ip"></select>

<input
id="iq"
type="number"
min="1"
placeholder="Quantity">

<select id="ie"></select>

<input
id="ir"
placeholder="Invoice / Reference">

<button id="ib">
ADD STOCK
</button>

<div id="im"></div>

</div>

</section>


<section id="out" class="hidden">

<div class="panel">

<h2>➖ Stock Issue</h2>

<select id="op"></select>

<input
id="oq"
type="number"
min="1"
placeholder="Quantity">

<select id="oe"></select>

<input
id="om"
placeholder="Machine / Section">

<button id="ob">
ISSUE STOCK
</button>

<div id="omsg"></div>

</div>

</section>


<section id="hist" class="hidden">

<div class="panel">

<h2>📋 History</h2>

<table>

<thead>
<tr>
<th>Time</th>
<th>Action</th>
<th>Part</th>
<th>Qty</th>
<th>Employee</th>
</tr>
</thead>

<tbody id="ht"></tbody>

</table>

</div>

</section>

</main>


<script>

const BACKEND_URL =
'https://script.google.com/macros/s/AKfycbxBUvYtsbVY4c2MRYGoSfiiTXCzFiOvE44_tsNQ2_bvNlo1K3B8zbveckI08iws7iY/exec';


let P = [];
let H = [];
let EMPLOYEES = [];


const $ = x =>
document.getElementById(x);


function status(p){

if(p.stock <= 0)
return ["OUT OF STOCK","out"];

if(p.stock <= p.reorder)
return ["LOW STOCK","low"];

return ["AVAILABLE","ok"];

}


function esc(x){

return String(x ?? "")
.replace(
/[&<>"']/g,
c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}


function render(id,q,full){

const a =
P.filter(p =>
(p.name+" "+p.category)
.toLowerCase()
.includes((q||"").toLowerCase())
);

$(id).innerHTML =
a.map(p => {

const s=status(p);

return full

? `<tr>
<td>${esc(p.name)}</td>
<td>${esc(p.category)}</td>
<td>${p.stock}</td>
<td class="${s[1]}">${s[0]}</td>
</tr>`

: `<tr>
<td>${esc(p.name)}</td>
<td>${p.stock}</td>
<td class="${s[1]}">${s[0]}</td>
</tr>`;

}).join("");

}


function fill(){

const options =
P.map(p =>
`<option value="${esc(p.name)}">
${esc(p.name)}
</option>`
).join("");

$("ip").innerHTML=options;
$("op").innerHTML=options;


const empOptions =
EMPLOYEES.map(e =>
`<option value="${esc(e)}">
${esc(e)}
</option>`
).join("");

$("ie").innerHTML=empOptions;
$("oe").innerHTML=empOptions;

}


function refresh(){

$("total").textContent=P.length;

$("stock").textContent =
P.reduce(
(a,p)=>a+(Number(p.stock)||0),
0
);

$("low").textContent =
P.filter(
p=>p.stock>0 &&
p.stock<=p.reorder
).length;

$("outn").textContent =
P.filter(
p=>p.stock<=0
).length;


render(
"dt",
$("dsearch").value,
false
);

render(
"pt",
$("search").value,
true
);

fill();


$("ht").innerHTML =
H.map(x =>
`<tr>
<td>${esc(x.timestamp)}</td>
<td>${esc(x.type)}</td>
<td>${esc(x.part)}</td>
<td>${x.quantity}</td>
<td>${esc(x.employee)}</td>
</tr>`
).join("");

}


function show(id){

document
.querySelectorAll("section")
.forEach(
x=>x.classList.add("hidden")
);

$(id).classList.remove("hidden");


document
.querySelectorAll("nav button")
.forEach(
b =>
b.classList.toggle(
"active",
b.dataset.p==id
)
);

}


async function api(
action,
params={}
){

const url =
new URL(BACKEND_URL);

url.searchParams.set(
"action",
action
);


Object.entries(params)
.forEach(
([k,v]) =>
url.searchParams.set(k,v)
);


const r =
await fetch(
url.toString(),
{
cache:"no-store"
}
);


if(!r.ok)
throw new Error(
"Server error: "+r.status
);


const data =
await r.json();


if(data.success===false)
throw new Error(
data.error ||
"Request failed"
);


return data;

}


async function loadAll(){

$("im").innerHTML =
'<div class="msg">Loading stock data...</div>';


try{

const [
inv,
emps,
hist
] = await Promise.all([

api("inventory"),

api("employees"),

api("history")

]);


P =
(inv.parts || [])
.map(p => ({

name:String(p.name||""),

category:String(
p.category||""
),

stock:Number(
p.stock||0
),

reorder:Number(
p.reorder||0
),

price:Number(
p.price||0
)

}));


EMPLOYEES =
emps.employees || [];


H =
hist.history || [];


refresh();


$("im").innerHTML="";


}

catch(err){

$("im").innerHTML =
'<div class="msg">' +
'Could not connect to Google Sheet: ' +
esc(err.message) +
'</div>';

console.error(err);

}

}


async function doTransaction(type){

const isAdd =
type==="Add";


const part =
$(isAdd ? "ip":"op").value;


const qty =
Number(
$(isAdd ? "iq":"oq").value
);


const employee =
$(isAdd ? "ie":"oe").value;


const msgId =
isAdd ? "im":"omsg";


if(!part)
return $(msgId).innerHTML =
'<div class="msg">Select a part</div>';


if(!employee)
return $(msgId).innerHTML =
'<div class="msg">Select employee</div>';


if(!qty || qty<1)
return $(msgId).innerHTML =
'<div class="msg">Enter quantity</div>';


if(!isAdd){

const current =
P.find(
p=>p.name===part
);


if(
current &&
qty>current.stock
)

return $(msgId).innerHTML =
'<div class="msg">' +
'Insufficient stock. Available: ' +
current.stock +
'</div>';

}


const btn =
$(isAdd ? "ib":"ob");


btn.disabled=true;

btn.textContent =
isAdd
? "ADDING..."
: "ISSUING...";


$(msgId).innerHTML =
'<div class="msg">' +
'Saving to Google Sheet...' +
'</div>';


try{

const result =
await api(
"transaction",
{
employee:employee,
type:type,
part:part,
qty:qty
}
);


await loadAll();


$(isAdd ? "iq":"oq")
.value="";


$(msgId).innerHTML =
'<div class="msg">' +

(
isAdd
? "Stock added ✓ "
: "Stock issued ✓ "
) +

"New stock: " +
result.newStock +

" | Status: " +
result.status +

'</div>';

}

catch(err){

$(msgId).innerHTML =
'<div class="msg">' +
'Error: ' +
esc(err.message) +
'</div>';

}

finally{

btn.disabled=false;

btn.textContent =
isAdd
? "ADD STOCK"
: "ISSUE STOCK";

}

}


document
.querySelectorAll("nav button")
.forEach(
b =>
b.onclick =
()=>show(b.dataset.p)
);


$("dsearch").oninput =
()=>render(
"dt",
$("dsearch").value,
false
);


$("search").oninput =
()=>render(
"pt",
$("search").value,
true
);


$("ib").onclick =
()=>doTransaction("Add");


$("ob").onclick =
()=>doTransaction("Issue");


loadAll();

</script>

</body>
</html>
